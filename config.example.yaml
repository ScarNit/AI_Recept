# Kopiraj u config.yaml i prilagodi. API ključevi NE idu ovdje nego u varijable okoline
# (vidi .env.example).

llm:
  # gemini  – besplatni ključ s https://aistudio.google.com/apikey (varijabla GEMINI_API_KEY)
  # openai  – bilo koji OpenAI-kompatibilni API (OPENAI_API_KEY, opcionalno OPENAI_BASE_URL)
  # manual  – bez ključa: prompt se sprema u datoteku, zalijepiš ga u ChatGPT/Gemini/Claude
  provider: gemini
  # Redoslijed = prioritet. Besplatni modeli su povremeno preopterećeni (HTTP 503), pa
  # recept kruži kroz listu. Nazivi modela se mijenjaju – popis: GET /v1beta/openai/models
  models:
    - gemini-3.6-flash
    - gemini-3.5-flash
    - gemini-flash-latest
    - gemini-3.5-flash-lite
    - gemini-flash-lite-latest
  temperature: 0.7
  max_retries: 5        # broj krugova kroz listu modela
  timeout_s: 240

provjera:
  automatski_popravak: true   # primijeni ispravke AI kritičara (uz provjeru brojki) i ponovno renderiraj
