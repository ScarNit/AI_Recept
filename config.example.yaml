# Kopiraj u config.yaml i prilagodi. API ključevi NE idu ovdje nego u varijable okoline
# (vidi .env.example). Pružatelj čija varijabla nije postavljena automatski se preskače,
# pa je dovoljan i samo besplatni GEMINI_API_KEY.

llm:
  # Lanac OpenAI-kompatibilnih pružatelja, redom prioriteta. Kad je model preopterećen
  # (HTTP 503) ili potroši besplatnu kvotu (429), recept prelazi na sljedeći.
  # Nazivi modela se mijenjaju – popis: GET <base_url>/models
  # Za rad bez ijednog ključa: provider: manual (prompt → ChatGPT/Gemini chat → odgovor u datoteku)
  providers:
    - name: gemini                       # besplatno: https://aistudio.google.com/apikey
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      key_env: GEMINI_API_KEY
      models:
        - gemini-3.6-flash               # najbolji hrvatski u testu; besplatno ~20 zahtjeva/dan
        - gemini-3.5-flash
        - gemini-flash-latest
    - name: groq                         # besplatno: https://console.groq.com/keys
      base_url: https://api.groq.com/openai/v1
      key_env: GROQ_API_KEY
      models:
        - id: openai/gpt-oss-120b        # test 25. 11. 2026.: dobar hrvatski, brz; ne prima slike
          vision: false
        # qwen/qwen3.8-27b – izbačen: gramatičke greške u hrvatskom
    - name: openrouter                   # besplatni modeli s nastavkom ":free": https://openrouter.ai/keys
      base_url: https://openrouter.ai/api/v1
      key_env: OPENROUTER_API_KEY
      models:
        - id: google/gemma-4-31b-it:free # prima slike (rezerva za vision korake); često ograničen
        # nvidia/nemotron-3.5-super-vl:free – izbačen: miješa srpski ("promenu", "oznažite")
    - name: gemini-lite                  # zadnja rezerva: lakši Gemini modeli (veća kvota, slabiji tekst)
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      key_env: GEMINI_API_KEY
      models:
        - gemini-3.5-flash-lite
        - gemini-flash-lite-latest
  temperature: 0.7
  max_retries: 5        # broj krugova kroz cijeli lanac
  timeout_s: 240

slike:
  # Generator AI pozadinskih scena (python -m recept scene):
  #   rucno        – zapiše promptove u ai_slike/PROMPTOVI.md za ChatGPT / Gemini aplikaciju (preporučeno)
  #   pollinations – automatski i bez ključa, ali niža rezolucija i vodeni žig (samo za test)
  # Hugging Face isproban i odbačen: besplatni modeli za slike ukinuti (410), ostali traže kredite (402).
  generator: rucno

provjera:
  automatski_popravak: true   # primijeni ispravke AI kritičara (uz provjeru brojki) i ponovno renderiraj
