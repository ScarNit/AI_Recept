# AI pozadinske scene (python -m recept scene). Polazište su prijedlozi iz faze izrade
# (05_sadrzaj.json → ai_scena_prompt), ljudski dorađeni prema snimkama Instagrama: feed
# @gymbeamhr koristi i AI-stilizirane vizuale (npr. 3D licitar), pa adventski story to prati.
# Pravila brenda (bez teksta, logotipa i ambalaže; donja polovica tamna) dodaju se automatski.
- objava: 1
  kadar: 1
  format: karusel
  prompt: >-
    Cinematic photo of a dark modern gym at night: a steel barbell on a rack, chalk dust floating
    in the air, dramatic warm orange (#FF4410) rim light from the right, deep black shadows,
    shallow depth of field, photorealistic. Keep the main subject in the upper part of the frame.
- objava: 3
  kadar: 1
  format: story
  prompt: >-
    Playful 3D render: a cute gingerbread man doing a biceps curl with a tiny dumbbell, standing on
    a dark green surface among small wrapped gifts and warm fairy lights, festive bokeh, rich dark
    green background with warm orange (#FF4410) accents. Keep the gingerbread man in the upper part
    of the frame.
- objava: 3
  kadar: 4
  format: story
  prompt: >-
    Cozy festive evening scene: a window with falling snow, warm fairy lights and a mug of hot cocoa
    on a dark wooden table, soft bokeh, dark moody tones with a warm orange (#FF4410) glow. Keep the
    details in the upper part of the frame.
